[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-demo"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
  "pydantic>=2.6",
  "requests>=2.31",
  "pillow>=10.0",
]

[project.scripts]
ollama-demo = "ollama_demo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
